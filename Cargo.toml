[package]
name = "neodoc"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
pretty_assertions = "1.4.1"
include_dir = {version = "0.7.4", features = ["glob"] }
datatest-stable = "0.3.3"

[[test]]
name = "block"
harness = false

[[test]]
name = "payload"
harness = false

[[test]]
name = "section"
harness = false

[[test]]
name = "span"
harness = false


[dependencies]
anyhow = "1.0.104"
nom = "8.0.0"
pretty_assertions = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"





