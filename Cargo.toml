[package]
name = "neodoc"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
pretty_assertions = "1.4.1"
include_dir = {version = "0.7.4", features = ["glob"] }
datatest-stable = "0.3.3"

[lib]
doctest = false

[[test]]
name = "integration"
harness = false 


[[xtest]]
name = "attr"
harness = false

[[xtest]]
name = "flag"
harness = false

[[xtest]]
name = "flag_first_word"
harness = false

[[xtest]]
name = "payload"
harness = false

[[xtest]]
name = "section"
harness = false

[[xtest]]
name = "section_attr"
harness = false

[[xtest]]
name = "span"
harness = false

[dependencies]
anyhow = "1.0.104"
nom = "8.0.0"
nom-language = "0.1.0"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"





